[mode]
; patch: 把字形写进现有文件（按 offset 顺序覆盖/扩容）
; tiles: 只输出连续 tile 数据（单文件，不读 input，不用 offset）
kind = patch

[paths]
; patch 模式才会读取 input；tiles 模式可留空
input = font22.dat
output = font22.new
codetable = font.tbl
font = C:\USERS\ADMINISTRATOR\APPDATA\LOCAL\MICROSOFT\WINDOWS\FONTS\SOURCEHANSANSCN-MEDIUM.OTF

[font]
; freetype 像素字号（不做下采样）
size_px = 20
; 字体集合（TTC/OTC）时可切换 index
index = 0

[tile]
; 输出 tile 的像素尺寸
width = 22
height = 22

[charset]
; 最大写入/输出多少个字符；留空表示用完整码表长度
max_tiles =

[write]
; 仅 patch 模式使用：从文件的哪个偏移开始写入（支持 0x 十六进制）
offset = 0x534e4

[options]
; endian_big=false 时每字节为 (右像素<<4)|左像素；true 时为 (左<<4)|右
endian_big = false
flipx = false
flipy = false
